<html lang="es">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Cotizador GMT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --wood: #7a4a24;
    --wood-light: #f4ebe1;
    --bg: #f6f4f1;
    --card: #ffffff;
    --text: #1f1b16;
    --muted: #6b645c;
    --border: #e2ddd6;
    --green: #2f7a3a;
    --red: #b3261e;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* Top bar */
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 600; flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; min-width: 44px; height: 44px; font-size: 20px; padding: 0 10px;
  }
  .badge {
    background: var(--wood-light); color: var(--wood); font-size: 13px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
  }

  /* Cards and layout */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .hero { text-align: center; padding: 26px 14px; }
  .hero h2 { margin: 0; font-size: 19px; }
  .logo-img { width: 90px; height: 90px; object-fit: contain; margin: 0 auto 10px; display: block; }
  .logo-ph {
    width: 84px; height: 84px; border-radius: 50%; background: var(--wood-light); color: var(--wood);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px;
    margin: 0 auto 10px;
  }
  .section-title {
    font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin: 20px 0 8px;
  }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .empty { text-align: center; color: var(--muted); padding: 34px 10px; }

  /* Buttons */
  .big-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 18px 16px;
    font-size: 18px; font-weight: 500; text-align: left;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--card); color: var(--text); margin-bottom: 10px;
  }
  .big-btn.primary { background: var(--wood); border-color: var(--wood); color: #fff; }
  .big-btn .ic { font-size: 24px; width: 30px; text-align: center; }
  .btn {
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 16px; width: 100%;
  }
  .btn.primary { background: var(--wood); border-color: var(--wood); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--red); }
  .btn.small { padding: 9px 10px; font-size: 15px; }
  .btn-stack > * { margin-top: 8px; }

  /* Forms */
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea {
    width: 100%; font-size: 16px; padding: 10px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 46px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  input:focus, textarea:focus { outline: 2px solid var(--wood); outline-offset: -1px; }

  /* Items */
  .item-head { display: flex; justify-content: space-between; align-items: center; }
  .item-num { font-weight: 600; color: var(--wood); }
    .del-btn { border: none; background: none; color: var(--red); font-size: 15px; padding: 6px; }
  .mode-row { display: flex; gap: 8px; align-items: center; }
  .mode-row input { flex: 1; min-width: 0; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
  .seg button { border: none; background: var(--card); color: var(--text); font-size: 16px; padding: 10px 14px; }
  .seg button.on { background: var(--wood); color: #fff; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 15px; }
  .row.total { font-weight: 700; font-size: 19px; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 10px; }
  .metric { background: var(--wood-light); border-radius: 10px; padding: 10px 12px; }
  .metric .l { font-size: 12px; color: var(--muted); }
  .metric .v { font-size: 18px; font-weight: 600; margin-top: 2px; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%); background: #222; color: #fff; padding: 11px 18px;
    border-radius: 22px; font-size: 15px; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: 90%; text-align: center; z-index: 10;
  }
  #toast.show { opacity: 1; }

  /* Edit banner and choice dialog */
  .edit-banner { background: var(--wood-light); border-color: var(--wood-light); font-size: 15px; }
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal { background: var(--card); border-radius: 16px; padding: 18px; width: 100%; max-width: 400px; }
  .modal h3 { margin: 0 0 6px; font-size: 18px; }
  .modal p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .modal .btn { margin-top: 8px; }
</style>
</head>

let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('quotes')) d.createObjectStore('quotes', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function tx(storeName, mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(storeName, mode);
    const req = fn(t.objectStore(storeName));
    t.oncomplete = () => resolve(req ? req.result : undefined);
    t.onerror = () => reject(t.error);
  });
}

const kvGet = (key) => tx('kv', 'readonly', (s) => s.get(key));
const kvSet = (key, val) => tx('kv', 'readwrite', (s) => s.put(val, key));
const quotesGetAll = () => tx('quotes', 'readonly', (s) => s.getAll());
const quotePut = (q) => tx('quotes', 'readwrite', (s) => s.put(q));
const quoteDelete = (id) => tx('quotes', 'readwrite', (s) => s.delete(id));

const money = (n) => moneyFmt.format(n || 0);

const clone = (o) => JSON.parse(JSON.stringify(o));

function num(v) {
  const n = parseFloat(String(v ?? '').replace(/,/g, ''));
  return isFinite(n) ? n : 0;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Custom logo from Configuración, or the built-in one */
function currentLogo() {

}

function logoFormat(dataUrl) {
  return dataUrl.startsWith('data:image/jpeg') ? 'JPEG' : 'PNG';

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function longDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} de ${MONTHS[m - 1]} del ${y}`;
}

function shortDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MONTHS[m - 1].slice(0, 3)} ${y}`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

function filledItems(items) {

function draftHasContent(d) {

/* The parts of a quote that the user edits (used to detect unsaved changes) */
function quoteContent(q) {
  const { date, client, attn, site, address, email, notes, items } = q;
  const disc = q.disc || '', discMode = q.discMode || '%', discReason = q.discReason || '';
  return JSON.stringify({ date, client, attn, site, address, email, notes: notes || '', disc, discMode, discReason, items });
}

/* True when a saved quote is open and has changes that were not saved */
function hasUnsavedEdits() {
  const d = state.draft;
  if (!d || !d.id) return false;
  const saved = state.quotes.find((q) => q.id === d.id);
  return !saved || quoteContent(saved) !== quoteContent(d);
}

/* True when there is work that is not in Mis cotizaciones yet */
function hasPendingWork() {
  const d = state.draft;
  if (!d) return false;
  return d.id ? hasUnsavedEdits() : draftHasContent(d);
}

/* =========================================================
   CALCULATIONS
   Profit and margin are always BEFORE IVA.
   ========================================================= */
function lineTotal(it) { return num(it.qty) * num(it.price); }
function lineCost(it) { return num(it.qty) * num(it.cost); }

/* Discount is applied to the subtotal, BEFORE IVA. q is the quote (optional). */
function calc(items, q) {
  let sub = 0, cost = 0, hasCost = false;
  for (const it of items) {
    sub += lineTotal(it);
    cost += lineCost(it);
    if (num(it.cost) > 0) hasCost = true;
  }
  sub = round2(sub);
  let disc = 0;
  if (q) {
    const v = num(q.disc);
    disc = q.discMode === '$' ? v : (sub * v) / 100;
    disc = round2(Math.min(Math.max(disc, 0), sub));
  }
  const net = round2(sub - disc);
  const iva = round2(net * IVA_RATE);
  const total = round2(net + iva);
  const profit = round2(net - cost);
  const margin = net ? (profit / net) * 100 : 0;
  const markup = cost ? (profit / cost) * 100 : 0;
  return { sub, disc, net, iva, total, cost: round2(cost), profit, margin, markup, hasCost };
}

/* "Descuento 3% (Pronto pago)" or "Descuento (Pronto pago)" for a fixed amount */
function discLabel(q) {
  const pct = q.discMode === '$' ? '' : ` ${qtyFmt.format(num(q.disc))}%`;
  const reason = String(q.discReason || '').trim();
  return `Descuento${pct}${reason ? ` (${reason})` : ''}`;
}

/* Discount input card, shared by Estimar utilidad and Cotización */
function discountCard(d) {
  const fixed = d.discMode === '$';
  return `
    <div class="section-title">Descuento (opcional)</div>
    <div class="card">
      <label style="margin-top:0">${fixed ? 'Descuento en pesos' : 'Descuento %'}</label>
      <div class="mode-row">
        <div class="seg">
          <button class="${fixed ? '' : 'on'}" data-action="setDiscMode" data-mode="%">%</button>
          <button class="${fixed ? 'on' : ''}" data-action="setDiscMode" data-mode="$">$</button>
        </div>
        <input data-scope="draft" data-f="disc" value="${esc(d.disc)}" inputmode="decimal" placeholder="0">
      </div>
      <label>Motivo del descuento</label>
      <input data-scope="draft" data-f="discReason" value="${esc(d.discReason)}" placeholder="Por ejemplo: pronto pago">
      <div class="hint">Se aplica al subtotal, antes del IVA. Si lo dejas vacío, no aparece en el PDF.</div>
    </div>`;
}

/* Subtotal → (discount → subtotal con descuento) → IVA → total */
function totalsRows(d, t, subLabel, totalLabel) {
  const hide = t.disc ? '' : 'display:none';
  return `
      <div class="row"><span>${subLabel}</span><span id="t-sub">${money(t.sub)}</span></div>
      <div class="row" id="t-disc-row" style="${hide}"><span id="t-disc-label">${esc(discLabel(d))}</span><span id="t-disc">-${money(t.disc)}</span></div>
      <div class="row" id="t-net-row" style="${hide}"><span>Subtotal con descuento</span><span id="t-net">${money(t.net)}</span></div>
      <div class="row"><span>IVA 16%</span><span id="t-iva">${money(t.iva)}</span></div>
      <div class="row total"><span>${totalLabel}</span><span id="t-total">${money(t.total)}</span></div>`;
}

/* "% de ganancia" = over cost (markup): price = cost × (1 + % / 100) */
function applyPct(it) {
  if (it.mode !== '%') return;
  const c = num(it.cost);
  it.price = String(it.pct).trim() === '' || !c ? '' : String(round2(c * (1 + num(it.pct) / 100)));
}

function lineProfitText(it) {
  const c = num(it.cost);
  if (!c) return 'Escribe tu costo';
  const p = num(it.qty) * (num(it.price) - c);
  const pct = ((num(it.price) - c) / c) * 100;
  return `${money(p)} · ${pct.toFixed(1)}%`;
}

function lineProfitClass(it) {
  return num(it.price) < num(it.cost) ? 'neg' : 'pos';
}

      ${field('accountName', 'Titular de la cuenta', 'Grupo MT Fortes Hermanos, S.A. de C.V.', 'text', 'A nombre de quién está la cuenta (a quién le depositan)')}
    </div>

    <div class="section-title">Respaldo</div>
    <div class="card">
      <div class="muted">Esto no es para guardar: tus datos ya se guardan solos. Es una copia de seguridad por si cambias de teléfono (por ejemplo, mándala por WhatsApp a tu hijo).</div>
      <div class="btn-stack">
        <button class="btn" data-action="exportBackup">Descargar respaldo</button>
        <button class="btn" data-action="pickBackup">Restaurar respaldo</button>
      </div>
      <input type="file" id="backupInput" accept="application/json,.json" hidden>
    </div>

    <div class="section-title">Zona de cuidado</div>
    <div class="card">
      <div class="muted">Borra todas las cotizaciones y la configuración de este app, solo en este teléfono. No afecta nada más.</div>
      <button class="btn danger" data-action="resetApp" style="margin-top:8px">Borrar datos de este app</button>
    </div>
  `;
}

/* Live-update totals without re-rendering (keeps keyboard focus) */
function updateTotals() {
  const d = state.draft;
  d.items.forEach((it, i) => {
    const ln = document.getElementById(`ln-${i}`);
    if (ln) ln.textContent = money(lineTotal(it));
    const lp = document.getElementById(`lp-${i}`);
    if (lp) {
      lp.textContent = lineProfitText(it);
      lp.className = lineProfitClass(it);
    }
    const lpr = document.getElementById(`lpr-${i}`);
    if (lpr && it.mode === '%') lpr.textContent = `Precio de venta: ${money(num(it.price))} c/u`;
  });
  const t = calc(d.items, d);
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set('t-sub', money(t.sub));
  set('t-disc-label', discLabel(d));
  set('t-disc', `-${money(t.disc)}`);
  set('t-net', money(t.net));
  for (const id of ['t-disc-row', 't-net-row']) {
    const row = document.getElementById(id);
    if (row) row.style.display = t.disc ? '' : 'none';
  }
  set('t-iva', money(t.iva));
  set('t-total', money(t.total));
  set('t-cost', money(t.cost));
  set('t-margin', `${t.markup.toFixed(1)}%`);
  set('t-profit-line', profitLine(t));
  const tp = document.getElementById('t-profit');
  if (tp) { tp.textContent = money(t.profit); tp.className = `v ${t.profit < 0 ? 'neg' : 'pos'}`; }
}

/* =========================================================
   QUOTES: save / open / duplicate / delete
   ========================================================= */
function validateDraft() {
  const d = state.draft;
  if (!d.client.trim()) { toast('Escribe el nombre del cliente'); return false; }
  if (!filledItems(d.items).length) { toast('Agrega al menos un artículo'); return false; }
  return true;
}

/* Company, text and bank details stored with each saved quote,
   so an old quote's PDF always comes out exactly as it was sent */
const SNAPSHOT_KEYS = ['companyName', 'signer', 'city', 'intro', 'deliveryTime', 'paymentTerms', 'closing',
  'bankName', 'account', 'branch', 'clabe', 'reference', 'accountName', 'logo'];

function takeSnapshot() {
  const snap = {};
  for (const k of SNAPSHOT_KEYS) snap[k] = state.settings[k] ?? '';
  return snap;
}

/* Synchronous part runs first (assigns number), then saving happens in the background.
   This matters on iPhone: the share menu must open right after the tap. */
function commitDraft() {
  const d = state.draft;
  const now = new Date().toISOString();
  if (!d.id) { d.id = uid(); d.createdAt = now; }
  if (!d.number) {
    d.number = Math.max(1, Math.floor(num(state.settings.nextNumber)) || 1);
    state.settings.nextNumber = d.number + 1;
    kvSet('settings', state.settings).catch(console.error);
  }
  d.updatedAt = now;
  d.snap = takeSnapshot();
  const saved = clone(d);
  const idx = state.quotes.findIndex((q) => q.id === d.id);
  if (idx >= 0) state.quotes[idx] = saved; else state.quotes.push(saved);
  return Promise.all([quotePut(saved), kvSet('draft', d)]).catch((e) => {
    console.error(e);
    toast('No se pudo guardar');
  });
}

function startNewDraft() {
  if (hasPendingWork() && !confirm('¿Empezar una nueva? Lo que no hayas guardado se perderá.')) return;
  resetDraft();
  render();
}

function resetDraft() {
  state.draft = newDraft();
  kvSet('draft', state.draft).catch(console.error);
}

/* From home: continue unfinished work, otherwise start blank */
function startWork(screen) {
  if (!hasPendingWork()) resetDraft();
  go(screen);
}

/* Before replacing the current draft (open / duplicate) */
function okToReplaceDraft() {
  return !hasPendingWork() || confirm('Tienes una cotización sin terminar. Si continúas, se perderá. ¿Continuar?');
}

/* Back button: ask only when an edited saved quote has unsaved changes */
async function goBack() {
  if ((state.screen === 'quote' || state.screen === 'estimate') && hasUnsavedEdits()) {
    const n = state.draft.number;
    const choice = await askChoice('Cambios sin guardar', `Hiciste cambios a la cotización folio ${n}.`, [
      { label: 'Guardar cambios', cls: 'primary', value: 'save' },
      { label: 'Descartar cambios', cls: 'danger', value: 'discard' },
      { label: 'Seguir editando', value: 'stay' }
    ]);
    if (choice === 'stay') return;
    if (choice === 'save') {
      if (!validateDraft()) return;
      await commitDraft();
      toast(`Cambios guardados (folio ${n})`);
    }
    if (choice === 'discard') resetDraft();
  }
  go('home');
}

/* Simple dialog with several buttons; resolves with the chosen value */
function askChoice(title, message, options) {
  return new Promise((resolve) => {
    const root = document.getElementById('modal');
    root.innerHTML = `
      <div class="modal-bg"><div class="modal">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        ${options.map((o, i) => `<button class="btn ${o.cls || ''}" data-choice="${i}">${esc(o.label)}</button>`).join('')}
      </div></div>`;
    root.onclick = (e) => {
      const b = e.target.closest('[data-choice]');
      if (!b) return;
      root.innerHTML = '';
      root.onclick = null;
      resolve(options[Number(b.dataset.choice)].value);
    };
  });
}

/* =========================================================
   PDF
   ========================================================= */
function pdfFileName(q) {
  const client = (q.client || 'cliente')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  return `Cotizacion-${q.number}-${client}.pdf`;
}

function buildPdf(q) {
  const s = { ...state.settings, ...(q.snap || {}) };
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const W = 612, H = 792, M = 48;
  let y = 60;

  const ensure = (h) => { if (y + h > H - 50) { doc.addPage(); y = 60; } };

  // Logo (top right)
  const logo = s.logo || DEFAULT_LOGO;
  let logoBottom = 36;
  try {
    const p = doc.getImageProperties(logo);
    const scale = Math.min(110 / p.width, 76 / p.height);
    const w = p.width * scale, h = p.height * scale;
    doc.addImage(logo, logoFormat(logo), W - M - w, 36, w, h);
    logoBottom = 36 + h;
  } catch (e) { console.error(e); }

  // Header (left): company name and title
  doc.setFont('helvetica', 'bold').setFontSize(16);
  const nameLines = doc.splitTextToSize(s.companyName || '', W - M * 2 - 130);
  doc.text(nameLines, M, y);
  y += 20 * nameLines.length + 8;
  doc.setFontSize(14);
  doc.text('COTIZACIÓN', M, y);

  // Date and folio (right, below the logo)
  let ry = logoBottom + 18;
  doc.setFont('helvetica', 'normal').setFontSize(10);
  doc.text(`${s.city || 'CDMX'} a ${longDate(q.date)}`, W - M, ry, { align: 'right' });
  ry += 14;
  doc.text(`Folio: ${q.number}`, W - M, ry, { align: 'right' });
  y = Math.max(y, ry) + 28;

  // Client block
  doc.setFont('helvetica', 'bold').setFontSize(11);
  doc.text(q.client || '', M, y);
  y += 16;
  const info = [['Atención:', q.attn], ['Obra:', q.site], ['Dirección:', q.address], ['Correo:', q.email]];
  doc.setFontSize(10);
  for (const [label, value] of info) {
    if (!String(value || '').trim()) continue;
    const lines = doc.splitTextToSize(value, W - M * 2 - 70);
    doc.setFont('helvetica', 'bold').text(label, M, y);
    doc.setFont('helvetica', 'normal').text(lines, M + 70, y);
    y += 14 * lines.length;
  }
  y += 10;

  doc.setFont('helvetica', 'bold').text('P r e s e n t e', M, y);
  y += 14;
  doc.setFont('helvetica', 'normal').setFontSize(9);
  const intro = doc.splitTextToSize(s.intro || '', W - M * 2);
  doc.text(intro, M, y);
  y += 12 * intro.length + 4;

  // Notes (only when filled)
  if (String(q.notes || '').trim()) {
    y += 4;
    const noteLines = doc.splitTextToSize(String(q.notes).trim(), W - M * 2 - 46);
    doc.setFont('helvetica', 'bold').text('Notas:', M, y);
    doc.setFont('helvetica', 'normal').text(noteLines, M + 46, y);
    y += 12 * noteLines.length + 6;
  }

  // Items table
  const rows = filledItems(q.items).map((it) => [
    qtyFmt.format(num(it.qty)),
    it.desc,
    it.measures,
    money(num(it.price)),
    money(lineTotal(it))
  ]);
  doc.autoTable({
    startY: y,
    head: [['Cantidad', 'Artículo', 'Medidas', 'Precio', 'Subtotal']],
    body: rows,
    theme: 'grid',
    margin: { left: M, right: M },
    styles: { font: 'helvetica', fontSize: 9, cellPadding: 6, valign: 'top', lineColor: [200, 200, 200] },
    headStyles: { fillColor: [122, 74, 36], textColor: 255, fontStyle: 'bold' },
    columnStyles: {
      0: { halign: 'center', cellWidth: 58 },
      2: { cellWidth: 95 },
      3: { halign: 'right', cellWidth: 75 },
      4: { halign: 'right', cellWidth: 85 }
    }
  });
  y = doc.lastAutoTable.finalY + 16;

  // Totals
  const t = calc(q.items, q);
  ensure(95);
  const labelX = W - M - 100;
  doc.setFontSize(10);
  const totalRows = [['Subtotal', money(t.sub), false]];
  if (t.disc) {
    totalRows.push([discLabel(q), `-${money(t.disc)}`, false]);
    totalRows.push(['Subtotal con descuento', money(t.net), false]);
  }
  totalRows.push(['IVA 16%', money(t.iva), false], ['Total', money(t.total), true]);
  totalRows.forEach(([label, val, bold]) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(bold ? 12 : 10);
    doc.text(label, labelX, y, { align: 'right' });
    doc.text(val, W - M, y, { align: 'right' });
    y += bold ? 18 : 15;
  });
  y += 14;

  // Terms and bank details
  const terms = [
    ['Tiempo de entrega:', s.deliveryTime],
    ['Condiciones de pago:', s.paymentTerms],
    ['Banco:', s.bankName],
    ['Número de cuenta:', s.account],
    ['Sucursal:', s.branch],
    ['CLABE Interbancaria:', s.clabe],
    ['Referencia:', s.reference],
    ['Nombre:', s.accountName]
  ].filter(([, v]) => String(v || '').trim());
  ensure(16 * terms.length + 10);
  doc.setFontSize(10);
  for (const [label, value] of terms) {
    doc.setFont('helvetica', 'normal').text(label, M + 40, y);
    doc.setFont('helvetica', 'bold').text(String(value), M + 180, y);
    y += 16;
  }
  y += 24;

  // Closing and signature
  ensure(80);
  doc.setFont('helvetica', 'italic').setFontSize(10);
  doc.text(doc.splitTextToSize(s.closing || '', 230), M, y);
  const sigX = W - M - 120;
  doc.setFont('helvetica', 'normal');
  doc.text('A t e n t a m e n t e', sigX, y, { align: 'center' });
  y += 34;
  doc.setDrawColor(60).line(sigX - 110, y, sigX + 110, y);
  y += 14;
  if (s.signer) { doc.text(s.signer, sigX, y, { align: 'center' }); y += 14; }
  if (s.companyName) doc.text(doc.splitTextToSize(s.companyName, 220), sigX, y, { align: 'center' });

  return doc;
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function pdfReady() {
  if (window.jspdf && window.jspdf.jsPDF) return true;
  toast('Se necesita internet para generar el PDF');
  return false;
}

async function shareFile(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
    } catch (e) {
      if (e.name !== 'AbortError') { console.error(e); toast('No se pudo compartir'); }
    }
  } else {
    downloadBlob(blob, name);
  }
}

function sharePdf(q) {
  if (!pdfReady()) return;
  const blob = buildPdf(q).output('blob');
  shareFile(blob, pdfFileName(q), 'application/pdf');
}

function viewPdf(q) {
  if (!pdfReady()) return;
  const blob = buildPdf(q).output('blob');
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if (!w) downloadBlob(blob, pdfFileName(q));
}

/* =========================================================
   LOGO AND BACKUP
   ========================================================= */
function loadLogo(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 400;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      state.settings.logo = canvas.toDataURL('image/png');
      kvSet('settings', state.settings).catch(console.error);
      render();
      toast('Logo guardado');
    };
    img.onerror = () => toast('No se pudo leer la imagen');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function exportBackup() {
  const data = {
    app: 'cotizador-gmt',
    version: 1,
    exportedAt: new Date().toISOString(),
    settings: state.settings,
    quotes: state.quotes
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  shareFile(blob, `respaldo-gmt-${todayISO()}.json`, 'application/json');
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.app !== 'cotizador-gmt' || !Array.isArray(data.quotes)) throw new Error('bad file');
      if (!confirm(`Este respaldo tiene ${data.quotes.length} cotizaciones. Se combinarán con las que ya tienes y se reemplazará la configuración. ¿Continuar?`)) return;
      const keepNext = Math.max(num(state.settings.nextNumber), num(data.settings?.nextNumber));
      state.settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}), nextNumber: keepNext || 1 };
      await kvSet('settings', state.settings);
      for (const q of data.quotes) await quotePut(q);
      state.quotes = await quotesGetAll();
      render();
      toast('Respaldo restaurado');
    } catch (e) {
      console.error(e);
      toast('Ese archivo no es un respaldo válido');
    }
  };
  reader.readAsText(file);
}

/* Deletes ONLY this app's own database (cotizador-gmt), then reloads */
function resetApp() {
  if (!confirm('¿Borrar TODAS las cotizaciones y la configuración de este app? No se puede deshacer.')) return;
  if (!confirm('¿Seguro? Te recomendamos descargar un respaldo antes.')) return;
  db.close();
  const req = indexedDB.deleteDatabase(DB_NAME);
  req.onsuccess = req.onerror = req.onblocked = () => location.reload();
}

/* =========================================================
   EVENTS (delegated)
   ========================================================= */
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const { action, to, i, id } = el.dataset;
  const d = state.draft;
  const findQuote = () => state.quotes.find((q) => q.id === id);

  switch (action) {
    case 'go':
      go(to);
      break;
    case 'back':
      goBack();
      break;
    case 'start':
      startWork(to);
      break;
    case 'continueDraft':
      go('quote');
      break;
    case 'discardDraft':
      if (!confirm('¿Descartar lo que no se ha guardado?')) return;
      resetDraft();
      render();
      break;
    case 'saveAsNew':
      if (!validateDraft()) return;
      Object.assign(d, { id: null, number: null, createdAt: null });
      commitDraft().then(() => toast(`Guardada como nueva: folio ${d.number}`));
      render();
      break;
    case 'newDraft':
      startNewDraft();
      break;
    case 'addItem':
      d.items.push(newItem());
      saveDraftSoon();
      render();
      window.scrollTo(0, document.body.scrollHeight);
      break;
    case 'delItem':
      if (d.items.length === 1) d.items = [newItem()];
      else d.items.splice(Number(i), 1);
      saveDraftSoon();
      render(true);
      break;
    case 'setDiscMode': {
      const mode = el.dataset.mode;
      const cur = d.discMode || '%';
      if (cur === mode) break;
      const sub = calc(d.items).sub;
      const v = num(d.disc);
      if (String(d.disc).trim() !== '' && sub) {
        d.disc = String(mode === '$' ? round2((sub * v) / 100) : round2((v / sub) * 100));
      }
      d.discMode = mode;
      saveDraftSoon();
      render(true);
      break;
    }
    case 'setMode': {
      const it = d.items[Number(i)];
      const mode = el.dataset.mode;
      if ((it.mode || '$') === mode) break;
      if (mode === '%') {
        const c = num(it.cost);
        it.pct = c && num(it.price) ? String(round2(((num(it.price) - c) / c) * 100)) : '';
      }
      it.mode = mode;
      saveDraftSoon();
      render(true);
      break;
    }
    case 'applyPctAll': {
      const v = document.getElementById('applyPct').value.trim();
      if (v === '' || !isFinite(parseFloat(v))) { toast('Escribe un porcentaje'); return; }
      let n = 0;
      d.items.forEach((it) => {
        if (num(it.cost) > 0) { it.mode = '%'; it.pct = v; applyPct(it); n++; }
      });
      if (!n) { toast('Primero escribe el costo de los artículos'); return; }
      saveDraftSoon();
      render(true);
      toast(`${v}% aplicado a ${n} artículo(s)`);
      break;
    }
    case 'saveQuote': {
      if (!validateDraft()) return;
      const wasSaved = !!d.id;
      commitDraft().then(() => toast(wasSaved ? `Cambios guardados (folio ${d.number})` : `Cotización folio ${d.number} guardada`));
      render();
      break;
    }
    case 'sharePdf':
      if (!validateDraft()) return;
      commitDraft();
      sharePdf(d);
      render();
      break;
    case 'viewPdf':
      if (!validateDraft()) return;
      commitDraft();
      viewPdf(d);
      render();
      break;
    case 'openQuote':
      if (d.id === id) { go('quote'); break; }
      if (!okToReplaceDraft()) return;
      state.draft = clone(findQuote());
      kvSet('draft', state.draft).catch(console.error);
      go('quote');
      break;
    case 'shareSaved':
      sharePdf(findQuote());
      break;
    case 'dupQuote': {
      if (!okToReplaceDraft()) return;
      const copy = clone(findQuote());
      Object.assign(copy, { id: null, number: null, date: todayISO(), createdAt: null, updatedAt: null });
      state.draft = copy;
      kvSet('draft', state.draft).catch(console.error);
      go('quote');
      toast('Copia lista: cambia lo que necesites');
      break;
    }
    case 'delQuote': {
      const q = findQuote();
      if (!confirm(`¿Eliminar la cotización folio ${q.number}? No se puede deshacer.`)) return;
      state.quotes = state.quotes.filter((x) => x.id !== id);
      quoteDelete(id).catch(console.error);
      if (state.draft.id === id) { state.draft.id = null; state.draft.number = null; }
      render();
      break;
    }
    case 'pickLogo':
      document.getElementById('logoInput').click();
      break;
    case 'removeLogo':
      state.settings.logo = '';
      kvSet('settings', state.settings).catch(console.error);
      render();
      break;
    case 'exportBackup':
      exportBackup();
      break;
    case 'pickBackup':
      document.getElementById('backupInput').click();
      break;
    case 'resetApp':
      resetApp();
      break;
  }
});

app.addEventListener('input', (e) => {
  const el = e.target;
  const f = el.dataset.f;
  if (!f) return;
  const scope = el.dataset.scope;
  if (scope === 'item') {
    const it = state.draft.items[Number(el.dataset.i)];
    it[f] = el.value;
    if (f === 'pct' || f === 'cost') applyPct(it);
    if (f === 'price' && it.mode === '%') it.mode = '$';
    updateTotals();
    saveDraftSoon();
  } else if (scope === 'draft') {
    state.draft[f] = el.value;
    if (f === 'disc' || f === 'discReason') updateTotals();
    saveDraftSoon();
  } else if (scope === 'settings') {
    state.settings[f] = f === 'nextNumber' ? Math.floor(num(el.value)) || 1 : el.value;
    setSaveStatus('Guardando…');
    saveSettingsSoon();
  }
});

app.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (e.target.id === 'logoInput') loadLogo(file);
  if (e.target.id === 'backupInput') importBackup(file);
  e.target.value = '';
});

/* =========================================================
   START
   ========================================================= */
(async function init() {
  try {
    db = await openDB();
    const saved = await kvGet('settings');
    state.settings = { ...DEFAULT_SETTINGS, ...(saved || {}) };
    state.draft = (await kvGet('draft')) || newDraft();
    state.quotes = (await quotesGetAll()) || [];
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    console.error(e);
    state.draft = newDraft();
    toast('No se pudo abrir la base de datos');
  }
  render();
})();
